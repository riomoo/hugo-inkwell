baseURL: "https://example.com/"
languageCode: "en-us"
title: "My Story"
theme: "hugo-inkwell"

# Inkwell Theme Configuration
params:
  # Story metadata
  storyTitle: "My Story"
  storyTagline: "A tale of wonder and shadow"
  author: "Your Name"
  authorBio: ""
  authorAvatar: ""   # path to image

  # Author social links, shown as icons in the sidebar under the author card.
  # `icon` is optional — omit it and the theme will match a known icon by `name`
  # (twitter/x, instagram, youtube, mastodon/fediverse/activitypub, bluesky, discord,
  # github, tumblr, patreon/ko-fi, email, rss). Anything else falls back to a
  # generic link icon. Each link gets rel="me", so a Mastodon/ActivityPub profile
  # link here also serves as that platform's verification link.
  socialLinks: []
  # socialLinks:
  #   - name: "Twitter"
  #     url: "https://twitter.com/yourhandle"
  #   - name: "Instagram"
  #     url: "https://instagram.com/yourhandle"
  #   - name: "Patreon"
  #     url: "https://patreon.com/yourname"

  # UI Options
  showReadingProgress: true
  showWordCount: true
  showReadingTime: true
  showChapterNav: true       # prev/next chapter links at bottom
  showVolumeNav: true        # volume TOC in sidebar
  showTableOfContents: true  # in-chapter heading TOC
  tocDepth: 3

  # Cover image for homepage/social
  coverImage: ""

  # Footer
  footerText: ""

  # Features
  enableGlossary: true
  enableCharacters: true

  # Date format for chapters
  dateFormat: "January 2, 2006"

markup:
  goldmark:
    renderer:
      unsafe: true  # Allow raw HTML in markdown (needed for shortcodes)
  highlight:
    style: "dracula"
    lineNos: false

